# @package _global_
# Condition B: Projection-only LoRA
# Apply LoRA exclusively to the vision-language projection MLP

ablation:
  condition: B
  name: projection_only
  description: "LoRA on all linear layers in the vision-language MLP projector"

  lora:
    rank: 64                    # Higher rank for projection (fewer layers, more capacity needed)
    lora_alpha: 128
    lora_dropout: 0.05
    bias: none
    target_modules:
      # Qwen2.5-VL: MLP merger layers
      - "visual\.merger\.mlp\.[0-9]+$"
      # InternVL: mlp1 projector
      # - "mlp1\.[0-9]+$"
      # LLaVA: mm_projector layers
      # - "mm_projector\.[0-9]+$"

  # Approximate trainable parameters (projection is small, so use higher rank)
  target_trainable_params: 8_000_000    # ~8M params (projection MLP is small)

  # Training hyperparameters
  training:
    optimizer: adamw
    lr: 1.0e-3                  # Higher LR for projection (fast convergence)
    lr_scheduler: cosine_with_warmup
    warmup_ratio: 0.05
    weight_decay: 0.01
    max_epochs: 3
    batch_size: 4
    gradient_accumulation_steps: 8
    max_grad_norm: 1.0
    bf16: true
    gradient_checkpointing: false    # Projection is cheap, no need

  # Data
  data:
    dataset: physion_physics_qa
    train_path: data/physion/qa_train.jsonl
    val_path: data/physion/qa_val.jsonl
    max_samples: 50000
    shuffle: true

  # Checkpointing
  output_dir: results/ablation_metrics/condition_b_projection/
  save_steps: 500
  eval_steps: 250
  logging_steps: 50

  run_name: "ablation_condition_b_projection"
  tags: ["ablation", "projection-only", "lora"]
