# @package _global_
# InternVL 2.5-8B model configuration

model:
  name: internvl2_5_8b
  hf_name: OpenGVLab/InternVL2_5-8B
  model_type: internvl2_5

  # Architecture specs
  vision_encoder:
    type: intern_vit_300m
    hidden_dim: 1024
    num_layers: 24
    num_heads: 16
    patch_size: 14
    image_size: 448
    num_patches: 1024           # 32×32 for 448px input
    # InternViT uses full attention (no windowed attention)
    freeze_vit: partial          # Last 12 layers unfrozen for InternVL2.5

  projection:
    type: mlp_2_layer            # InternVL uses pixel_shuffle + MLP
    input_dim: 1024
    output_dim: 4096             # InternLM2-7B hidden dim
    pixel_shuffle_factor: 0.5    # Reduces spatial dim by 2x (4 patches → 1 token)

  llm:
    type: internlm2
    hidden_dim: 4096
    num_layers: 32
    num_heads: 32
    num_kv_heads: 8
    intermediate_size: 14336

  # Loading configuration
  loading:
    torch_dtype: bfloat16
    load_in_4bit: false
    device_map: auto
    trust_remote_code: true      # Required for InternVL custom modeling code

  # Activation extraction
  activation_hooks:
    stage_1_enc_out:
      module_path: vision_model.encoder.layers[-1]   # Last InternViT block
      hook_type: post_forward
    stage_2_post_proj:
      module_path: mlp1                               # MLP projector
      hook_type: post_forward
    stage_3_llm_8:
      module_path: language_model.model.layers[8]
      hook_type: post_forward
    stage_4_llm_16:
      module_path: language_model.model.layers[16]
      hook_type: post_forward

  # Image preprocessing
  processor:
    image_size: 448
    image_mean: [0.485, 0.456, 0.406]   # ImageNet mean
    image_std: [0.229, 0.224, 0.225]    # ImageNet std
    max_num_tiles: 6                     # InternVL dynamic tiling
    do_resize: true
